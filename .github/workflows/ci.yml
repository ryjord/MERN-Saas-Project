name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  client:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: client/package-lock.json

      - run: npm ci
      # CI=true makes Create React App treat warnings as errors.
      - run: npm run build
        env:
          CI: true

  server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: server/package-lock.json

      - run: npm ci

      # No build step and no tests, so this parses every source file to catch
      # syntax errors before deployment.
      - name: Parse server sources
        run: find . -name '*.js' -not -path './node_modules/*' -print0 | xargs -0 -n1 node --check
